version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: jscms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jscms
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme123}
      POSTGRES_DB: jscms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jscms"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jscms-network

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jscms-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://jscms:${DB_PASSWORD:-changeme123}@postgres:5432/jscms?schema=public
      JWT_SECRET: ${JWT_SECRET:-changeme-secret-key-change-in-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/auth/callback/google}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jscms-network
    volumes:
      # Optional: Mount uploads directory if you want persistent file storage
      - ./uploads:/app/uploads
      # Mount debug log directory for instrumentation
      - ./.cursor:/app/.cursor
    healthcheck:
      # Check if the Next.js server is responding on port 3000
      # Using wget (available in Alpine) to check root endpoint
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  jscms-network:
    driver: bridge
